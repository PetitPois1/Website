<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Game Hub</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/hub-site.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/hub-avatar.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .theme-preset-btn {
            display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
            padding: 1rem; border-radius: 1rem;
            background: var(--card-bg);
            border: 2px solid transparent;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s;
        }
        .theme-preset-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
        .theme-preset-btn.is-selected { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
        .theme-swatch { width: 100%; height: 3rem; border-radius: 0.5rem; border: 1px solid var(--border-color); }
    </style>
</head>
<body data-hub-page="settings" class="hub-site-body pb-12">
    <script src="js/hub-nav.js"></script>

    <main class="max-w-4xl mx-auto px-6">
        <header class="mb-10">
            <h1 class="text-4xl font-extrabold mb-2">Settings</h1>
            <p class="text-theme-muted">Personalize your Game Hub experience. Themes apply across the hub and game menus.</p>
        </header>

        <section class="hub-settings-card p-8 mb-8">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-3">
                <span class="text-2xl">🌈</span> Website theme
            </h2>

            <div id="theme-presets-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 mb-8"></div>

            <div class="border-t pt-8" style="border-color: var(--border-color)">
                <h3 class="text-sm font-bold text-theme-muted mb-4 uppercase tracking-wider">Custom colors</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs text-theme-muted mb-2">Background</label>
                        <input type="color" id="custom-bg" class="w-full h-10 rounded cursor-pointer bg-transparent border-none">
                    </div>
                    <div>
                        <label class="block text-xs text-theme-muted mb-2">Accent</label>
                        <input type="color" id="custom-primary" class="w-full h-10 rounded cursor-pointer bg-transparent border-none">
                    </div>
                    <div>
                        <label class="block text-xs text-theme-muted mb-2">Text</label>
                        <input type="color" id="custom-text" class="w-full h-10 rounded cursor-pointer bg-transparent border-none">
                    </div>
                </div>
            </div>
        </section>

        <div class="flex justify-end gap-4">
            <a href="index.html" class="px-6 py-2 rounded-xl font-bold transition-all" style="background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);">Cancel</a>
            <button id="save-settings-btn" type="button" class="px-8 py-2 rounded-xl font-bold text-white btn-theme-primary shadow-lg transition-all">Save changes</button>
        </div>
    </main>

    <script>
        let currentTheme = window.gameHubTheme.getPreset("default");

        function renderPresets() {
            const grid = document.getElementById("theme-presets-grid");
            grid.innerHTML = "";
            Object.keys(window.gameHubTheme.PRESETS).forEach((key) => {
                const p = window.gameHubTheme.PRESETS[key];
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "theme-preset-btn" + (currentTheme.id === key ? " is-selected" : "");
                btn.innerHTML = `<div class="theme-swatch" style="background:${p.bg}; box-shadow: inset 0 0 0 2px ${p.primary}"></div><span class="text-sm font-semibold" style="color:var(--text-main)">${p.name}</span>`;
                btn.onclick = () => {
                    currentTheme = window.gameHubTheme.getPreset(key);
                    window.gameHubTheme.applyTheme(currentTheme);
                    syncColorInputs();
                    renderPresets();
                };
                grid.appendChild(btn);
            });
        }

        function syncColorInputs() {
            const hex = (v, fallback) => (v && v.startsWith("#") ? v : fallback);
            document.getElementById("custom-bg").value = hex(currentTheme.bg, "#0f172a");
            document.getElementById("custom-primary").value = hex(currentTheme.primary, "#8b5cf6");
            document.getElementById("custom-text").value = hex(currentTheme.text, "#f8fafc");
        }

        function updateCustomTheme() {
            currentTheme = {
                id: "custom",
                name: "Custom",
                bg: document.getElementById("custom-bg").value,
                primary: document.getElementById("custom-primary").value,
                primaryDark: document.getElementById("custom-primary").value,
                text: document.getElementById("custom-text").value,
                textMuted: document.getElementById("custom-text").value,
                card: "rgba(255, 255, 255, 0.06)",
                border: "rgba(255, 255, 255, 0.12)",
                nav: "rgba(0, 0, 0, 0.85)",
                glow: "rgba(128, 128, 128, 0.12)",
                glowSecondary: "rgba(128, 128, 128, 0.06)",
            };
            window.gameHubTheme.applyTheme(currentTheme);
            renderPresets();
        }

        ["custom-bg", "custom-primary", "custom-text"].forEach((id) => {
            document.getElementById(id).addEventListener("input", updateCustomTheme);
        });

        document.getElementById("save-settings-btn").onclick = async () => {
            const user = window.gameHubAuth && window.gameHubAuth.getCurrentUser ? window.gameHubAuth.getCurrentUser() : null;
            try {
                await window.gameHubTheme.saveTheme(currentTheme, !!user);
                alert(user ? "Settings saved to your account!" : "Theme saved on this device. Sign in to sync everywhere.");
            } catch (e) {
                alert("Save failed: " + (e.message || e));
            }
        };

        document.addEventListener("DOMContentLoaded", async () => {
            const saved = localStorage.getItem("gamehub_theme");
            if (saved) {
                try {
                    currentTheme = JSON.parse(saved);
                    window.gameHubTheme.applyTheme(currentTheme);
                } catch (e) {}
            }
            syncColorInputs();
            renderPresets();
            setTimeout(() => window.gameHubTheme.loadFromCloud().then((t) => {
                if (t) {
                    currentTheme = t;
                    syncColorInputs();
                    renderPresets();
                }
            }), 1500);
        });
    </script>
</body>
</html>
