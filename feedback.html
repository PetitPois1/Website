<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/hub-site.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Game Hub</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/hub-avatar.js"></script>
    <script src="js/auth.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        iframe {
            filter: invert(0.9) hue-rotate(180deg);
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }

        iframe:hover {
            opacity: 1;
        }

        /* Light themes: soften iframe invert so the form stays readable */
        body[data-hub-theme="pastel"] iframe,
        body[data-hub-theme="pastel"] iframe:hover {
            filter: none;
            opacity: 1;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .loader-bg {
            animation: loading 1.5s infinite;
        }
    </style>
</head>
<body data-hub-page="feedback" class="hub-site-body pb-12">
    <script src="js/hub-nav.js"></script>

    <div class="max-w-4xl mx-auto px-6 text-center mb-12">
        <h1 class="text-5xl md:text-6xl font-extrabold mb-6 tracking-tight">
            Give us <span class="hub-accent-gradient">Feedback</span>
        </h1>
        <p class="text-theme-muted text-lg leading-relaxed max-w-2xl mx-auto">
            Your thoughts help us build better games. Whether it's a new idea or a feature request, we're listening.
        </p>
    </div>

    <main class="max-w-4xl mx-auto px-6">
        <div class="hub-form-panel rounded-[2.5rem] overflow-hidden relative">
            <div class="absolute inset-0 loader-bg -z-10"></div>

            <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSfSN8QDhOO02nXy8SpidRk3T1t-YP5m1USp6DlXBnTH6y6v4A/viewform?embedded=true"
                class="w-full h-[700px] border-none block"
                title="Feedback Form"
            >
                Loading…
            </iframe>
        </div>

        <div class="mt-12 text-center text-theme-muted">
            <p class="flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-theme-primary" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
                </svg>
                Fast-track bug reports on the <a href="bugs.html" class="text-theme-primary hover:underline">Bugs Page</a>
            </p>
        </div>
    </main>

    <footer class="hub-footer mt-20 border-t pt-10 text-center">
        <p class="text-sm">Game Hub is built for the players, by the students.</p>
    </footer>

</body>
</html>
